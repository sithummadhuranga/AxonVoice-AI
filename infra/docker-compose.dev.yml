# Local development overrides.
# Usage from the repository root:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d --build
#
# What this override does:
# - Removes the Ollama and ollama-init containers so Ollama runs natively on the host.
# - Keeps the application topology production-like: only the gateway is public.
# - Exposes PostgreSQL, Redis, and Qdrant on localhost for host-side migrations and inspection.

services:
  gateway:
    environment:
      PLATFORM_BASE_URL: http://localhost:8080
    ports: !override
      - "8080:8080"

  session-relay:
    environment:
      PLATFORM_BASE_URL: http://localhost:8080

  agent-config:
    environment:
      PLATFORM_BASE_URL: http://localhost:8080

  knowledge-base:
    depends_on: !override
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      PLATFORM_BASE_URL: http://localhost:8080
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  conversation-store:
    depends_on: !override
      postgres:
        condition: service_healthy
    environment:
      PLATFORM_BASE_URL: http://localhost:8080
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

  # Exposed on localhost so EF Core migrations can run from the host with:
  #   dotnet ef database update --project src/Services/AgentConfig
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"

  # Disable Ollama containers in development — use native host Ollama instead.
  ollama:
    profiles:
      - production-only

  ollama-init:
    profiles:
      - production-only
