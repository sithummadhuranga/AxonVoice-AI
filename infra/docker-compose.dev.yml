# Local development overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What this override does:
# - Exposes service ports on localhost for direct debugging / Swagger UI
# - Sets ASPNETCORE_ENVIRONMENT=Development so Swagger endpoints are active
# - REMOVES the Ollama and ollama-init containers — in development, run Ollama
#   natively on your host machine for better GPU access and faster model loading.
#   Install from https://ollama.com and run: ollama pull nomic-embed-text && ollama pull llama3.2
#   All services are pointed at http://host-gateway:11434 (Docker's host alias).
# - Exposes PostgreSQL on localhost so `dotnet ef database update` runs from the host
#   without going through Docker exec.

version: '3.9'

services:
  gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"

  session-relay:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Point at the host machine's native Ollama instance.
      OLLAMA_URL: http://host-gateway:11434
    ports:
      - "8081:8080"

  agent-config:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8082:8080"

  knowledge-base:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OLLAMA_URL: http://host-gateway:11434
    ports:
      - "8083:8080"

  conversation-store:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OLLAMA_URL: http://host-gateway:11434
    ports:
      - "8084:8080"

  # Exposed on localhost so EF Core migrations can run from the host with:
  #   dotnet ef database update --project src/Services/AgentConfig
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"

  # Disable Ollama containers in development — use native host Ollama instead.
  ollama:
    profiles:
      - production-only

  ollama-init:
    profiles:
      - production-only
