services:
  # ─── API Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: src/Dockerfile.service
      args:
        PROJECT_FILE: src/Gateway/AxonVoiceAI.Gateway.csproj
    command: AxonVoiceAI.Gateway.dll
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      REDIS_URL: redis:6379,abortConnect=false
      DATA_PROTECTION_KEYS_DIRECTORY: /var/axonvoice/dataprotection
      DATA_PROTECTION_CERTIFICATE_BASE64: ${DATA_PROTECTION_CERTIFICATE_BASE64}
      DATA_PROTECTION_CERTIFICATE_PASSWORD: ${DATA_PROTECTION_CERTIFICATE_PASSWORD}
    depends_on:
      session-relay:
        condition: service_started
      agent-config:
        condition: service_started
      knowledge-base:
        condition: service_started
      conversation-store:
        condition: service_started
      dashboard:
        condition: service_started
      widget:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - dataprotection_keys:/var/axonvoice/dataprotection
    networks:
      - internal
      - public

  # ─── Session Relay ──────────────────────────────────────────────────────────
  session-relay:
    build:
      context: ..
      dockerfile: src/Dockerfile.service
      args:
        PROJECT_FILE: src/Services/SessionRelay/AxonVoiceAI.SessionRelay.csproj
    command: AxonVoiceAI.SessionRelay.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      REDIS_URL: redis:6379,abortConnect=false
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      AGENT_CONFIG_URL: http://agent-config:8080
      KNOWLEDGE_BASE_URL: http://knowledge-base:8080
      DATA_PROTECTION_KEYS_DIRECTORY: /var/axonvoice/dataprotection
      DATA_PROTECTION_CERTIFICATE_BASE64: ${DATA_PROTECTION_CERTIFICATE_BASE64}
      DATA_PROTECTION_CERTIFICATE_PASSWORD: ${DATA_PROTECTION_CERTIFICATE_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      agent-config:
        condition: service_started
      knowledge-base:
        condition: service_started
    restart: unless-stopped
    volumes:
      - dataprotection_keys:/var/axonvoice/dataprotection
    networks:
      - internal

  # ─── Agent Config ───────────────────────────────────────────────────────────
  agent-config:
    build:
      context: ..
      dockerfile: src/Dockerfile.service
      args:
        PROJECT_FILE: src/Services/AgentConfig/AxonVoiceAI.AgentConfig.csproj
    command: AxonVoiceAI.AgentConfig.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-voiceagent};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      POSTGRES_URL: ${POSTGRES_URL:-}
      REDIS_URL: redis:6379,abortConnect=false
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DATA_PROTECTION_KEYS_DIRECTORY: /var/axonvoice/dataprotection
      DATA_PROTECTION_CERTIFICATE_BASE64: ${DATA_PROTECTION_CERTIFICATE_BASE64}
      DATA_PROTECTION_CERTIFICATE_PASSWORD: ${DATA_PROTECTION_CERTIFICATE_PASSWORD}
      DEFAULT_RATE_LIMIT_DAILY: ${DEFAULT_RATE_LIMIT_DAILY:-1000}
      DEFAULT_RATE_LIMIT_CONCURRENT: ${DEFAULT_RATE_LIMIT_CONCURRENT:-20}
      DEFAULT_BOOKING_HOLD_MINUTES: ${DEFAULT_BOOKING_HOLD_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - dataprotection_keys:/var/axonvoice/dataprotection
    networks:
      - internal

  # ─── Knowledge Base ─────────────────────────────────────────────────────────
  knowledge-base:
    build:
      context: ..
      dockerfile: src/Dockerfile.service
      args:
        PROJECT_FILE: src/Services/KnowledgeBase/AxonVoiceAI.KnowledgeBase.csproj
    command: AxonVoiceAI.KnowledgeBase.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-voiceagent};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      POSTGRES_URL: ${POSTGRES_URL:-}
      QDRANT_URL: http://qdrant:6334
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DATA_PROTECTION_KEYS_DIRECTORY: /var/axonvoice/dataprotection
      DATA_PROTECTION_CERTIFICATE_BASE64: ${DATA_PROTECTION_CERTIFICATE_BASE64}
      DATA_PROTECTION_CERTIFICATE_PASSWORD: ${DATA_PROTECTION_CERTIFICATE_PASSWORD}
    volumes:
      - document_uploads:/app/uploads
      - dataprotection_keys:/var/axonvoice/dataprotection
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # ─── Conversation Store ─────────────────────────────────────────────────────
  conversation-store:
    build:
      context: ..
      dockerfile: src/Dockerfile.service
      args:
        PROJECT_FILE: src/Services/ConversationStore/AxonVoiceAI.ConversationStore.csproj
    command: AxonVoiceAI.ConversationStore.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-voiceagent};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      POSTGRES_URL: ${POSTGRES_URL:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_SUMMARY_MODEL: ${OLLAMA_SUMMARY_MODEL:-}
      OLLAMA_COMPLETION_MODEL: ${OLLAMA_COMPLETION_MODEL:-llama3.2}
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DATA_PROTECTION_KEYS_DIRECTORY: /var/axonvoice/dataprotection
      DATA_PROTECTION_CERTIFICATE_BASE64: ${DATA_PROTECTION_CERTIFICATE_BASE64}
      DATA_PROTECTION_CERTIFICATE_PASSWORD: ${DATA_PROTECTION_CERTIFICATE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - dataprotection_keys:/var/axonvoice/dataprotection
    networks:
      - internal

  # ─── Tenant Dashboard ───────────────────────────────────────────────────────
  dashboard:
    build:
      context: ..
      dockerfile: frontend/dashboard/Dockerfile
    environment:
      AXONVOICE_API_URL: http://gateway:8080
      NEXT_PUBLIC_API_URL: ${PLATFORM_BASE_URL}
    restart: unless-stopped
    networks:
      - internal

  # ─── Embeddable Widget Assets ───────────────────────────────────────────────
  widget:
    build:
      context: ..
      dockerfile: frontend/widget/Dockerfile
    restart: unless-stopped
    networks:
      - internal

  # ─── Infrastructure: PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voiceagent}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is managed by EF Core Code-First migrations, not init SQL.
      # On first run: docker compose exec agent-config dotnet ef database update
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-voiceagent}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  # ─── Infrastructure: Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # ─── Infrastructure: Qdrant ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  # ─── Infrastructure: Ollama ─────────────────────────────────────────────────
  # For GPU acceleration (NVIDIA), install the NVIDIA Container Toolkit on the
  # host and uncomment the deploy section below:
  # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

  # Pulls required models on first startup — exits once done.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        ollama pull nomic-embed-text &&
        ollama pull llama3.2 &&
        echo 'Ollama models ready.'
      "
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"
    networks:
      - internal

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  # All inter-service traffic stays on this network; not reachable from outside.
  internal:
    driver: bridge
  # Only the gateway is attached to the public network.
  public:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  dataprotection_keys:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  document_uploads:
