# Nginx optional reverse proxy — sits in front of YARP when needed.
# Handles TLS termination and forwards all traffic to the gateway container.
# Only needed when deploying behind a domain with a managed TLS certificate.

events {
    worker_connections 1024;
}

http {
    # Disable server version disclosure.
    server_tokens off;

    # Increase timeouts for long-lived WebSocket sessions (10 min + buffer).
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
    proxy_connect_timeout 10s;

    # WebSocket upgrade support.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect all HTTP to HTTPS.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name your-domain.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    nosniff                               always;
        add_header X-Frame-Options           SAMEORIGIN                            always;

        location / {
            proxy_pass         http://gateway:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
